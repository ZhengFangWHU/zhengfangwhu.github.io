<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zheng Fang</title>
    <meta
      name="description"
      content="Zheng Fang. Research on trustworthy AI, adversarial attacks and defenses, and LLM/MLLM security and safety."
    >
    <meta name="author" content="Zheng Fang">
    <meta property="og:title" content="Zheng Fang">
    <meta
      property="og:description"
      content="Academic homepage of Zheng Fang. Research on trustworthy AI, adversarial attacks and defenses, and LLM/MLLM security and safety."
    >
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zhengfangwhu.github.io/">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="https://zhengfangwhu.github.io/">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="nav" aria-label="Primary navigation">
      <div class="nav-inner">
        <a href="#about" class="nav-logo" id="nav-logo">Zheng Fang</a>
        <div class="nav-links" id="nav-links">
          <a href="#about">About</a>
          <a href="#education">Education</a>
          <a href="#research">Research</a>
          <a href="#experience">Experience</a>
          <a href="#publications">Publications</a>
          <a href="#contact">Contact</a>
          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
        <button class="nav-menu-btn" id="menu-btn" aria-label="Open navigation menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </nav>

    <header class="hero" id="about">
      <div class="container">
        <h1 id="profile-name"></h1>
        <p class="subtitle" id="profile-title"></p>
        <p class="bio" id="profile-bio"></p>
        <div class="profile-links" id="profile-links" aria-label="Profile links"></div>
      </div>
    </header>

    <main>
      <section class="section section-alt" id="education">
        <div class="container">
          <h2>Education</h2>
          <div class="timeline-list" id="education-list"></div>
        </div>
      </section>

      <section class="section" id="research">
        <div class="container">
          <h2>Research</h2>
          <div class="research-list" id="research-list"></div>
        </div>
      </section>

      <section class="section section-alt" id="experience">
        <div class="container">
          <h2>Experience</h2>
          <div class="timeline-list" id="experience-list"></div>
        </div>
      </section>

      <section class="section" id="publications">
        <div class="container">
          <h2>Publications</h2>
          <p class="section-note" id="publications-note"></p>
          <div id="publication-container"></div>
        </div>
      </section>

      <section class="section section-alt" id="contact">
        <div class="container">
          <h2>Contact</h2>
          <div class="contact-list" id="contact-list"></div>
        </div>
      </section>
    </main>

    <button class="back-to-top" id="back-to-top" aria-label="Back to top">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"></path>
      </svg>
    </button>

    <footer class="footer">
      <div class="container">
        <p id="footer-text"></p>
      </div>
    </footer>

    <script src="data.js"></script>
    <script src="render.js"></script>
    <script>
      const themeToggle = document.getElementById("theme-toggle");
      const savedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
      } else if (prefersDark) {
        document.documentElement.setAttribute("data-theme", "dark");
      }

      themeToggle.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });

      const menuBtn = document.getElementById("menu-btn");
      const navLinks = document.getElementById("nav-links");
      menuBtn.addEventListener("click", () => {
        navLinks.classList.toggle("open");
        menuBtn.classList.toggle("open");
      });

      document.querySelectorAll('a[href^="#"]').forEach((anchor) => {
        anchor.addEventListener("click", (event) => {
          const target = document.querySelector(anchor.getAttribute("href"));
          if (!target) return;
          event.preventDefault();
          navLinks.classList.remove("open");
          menuBtn.classList.remove("open");
          target.scrollIntoView({ behavior: "smooth", block: "start" });
        });
      });

      const backToTop = document.getElementById("back-to-top");
      window.addEventListener("scroll", () => {
        backToTop.classList.toggle("visible", window.scrollY > 420);
      });
      backToTop.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      const sections = document.querySelectorAll("header[id], section[id]");
      const navAnchors = document.querySelectorAll('.nav-links a[href^="#"]');
      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            navAnchors.forEach((link) => link.classList.remove("active"));
            const active = document.querySelector(`.nav-links a[href="#${entry.target.id}"]`);
            if (active) active.classList.add("active");
          });
        },
        { rootMargin: "-20% 0px -72% 0px" }
      );
      sections.forEach((section) => observer.observe(section));
    </script>
  </body>
</html>
